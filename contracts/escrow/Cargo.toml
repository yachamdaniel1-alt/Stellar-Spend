[package]
name = "escrow"
version.workspace = true
edition.workspace = true

[dependencies]
soroban-sdk = { workspace = true }
stellar-spend-shared = { workspace = true }

[dev-dependencies]
# Self-dependency with `testutils` on, so `tests/` can reach `escrow::test_utils`.
escrow = { path = ".", features = ["testutils"] }
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]

[lib]
crate-type = ["cdylib", "rlib"]

[[test]]
name = "dispute"
path = "tests/dispute.rs"
